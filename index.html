<script>
window.loadThree = (() => {
  let threePromise;
  return () => {
    threePromise ||= import("./assets/vendor/three.module.min.js");
    return threePromise;
  };
})();
window.mountThreeScene = (mount, setup) => {
  let disposed = false;
  let cleanup = null;
  window.loadThree()
    .then((THREE) => {
      if (disposed || !mount.isConnected) return;
      cleanup = setup(THREE);
      if (disposed && cleanup) cleanup();
    })
    .catch((error) => console.warn("Three.js module failed to load", error));
  return () => {
    disposed = true;
    if (cleanup) cleanup();
  };
};
/* Drives a render loop only while `el` is on screen and the tab is visible.
   Returns a stop() that fully tears the loop down. */
window.rafScene = (el, render) => {
  let raf = 0;
  let running = false;
  let onScreen = true;
  let visible = !document.hidden;

  const frame = () => { render(); raf = requestAnimationFrame(frame); };
  const sync = () => {
    const should = onScreen && visible;
    if (should === running) return;
    running = should;
    if (should) raf = requestAnimationFrame(frame);
    else cancelAnimationFrame(raf);
  };

  const io = el ? new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; sync(); }, { threshold: 0 }) : null;
  if (io) { onScreen = false; io.observe(el); }
  const onVisibility = () => { visible = !document.hidden; sync(); };
  document.addEventListener("visibilitychange", onVisibility);
  sync();

  return () => {
    if (io) io.disconnect();
    document.removeEventListener("visibilitychange", onVisibility);
    cancelAnimationFrame(raf);
    running = false;
  };
};
</script>
