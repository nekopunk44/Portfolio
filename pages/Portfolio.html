<script>
window.loadThree = (() => {
  let threePromise;
  return () => {
    threePromise ||= import("https://unpkg.com/three@0.160.0/build/three.module.js");
    return threePromise;
  };
})();
window.mountThreeScene = (mount, setup) => {
  let disposed = false;
  let cleanup = null;
  window.loadThree()
    .then((THREE) => {
      if (disposed || !mount.isConnected) return;
      cleanup = setup(THREE);
      if (disposed && cleanup) cleanup();
    })
    .catch((error) => console.warn("Three.js module failed to load", error));
  return () => {
    disposed = true;
    if (cleanup) cleanup();
  };
};
</script>
